{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Task Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
<script>
(function(){
  try{
    var saved = localStorage.getItem('taskpanel-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;padding-bottom:18px;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div class="brand-name">Task Panel</div>
    </div>
    <h1 style="font-size:17px;text-align:center;margin-bottom:4px;">Sign in</h1>
    <p style="text-align:center;color:var(--ink-muted);font-size:12.5px;margin:0 0 20px;">Use the account your admin created for you</p>

    {% if form.errors %}
    <div class="auth-error">Incorrect username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
