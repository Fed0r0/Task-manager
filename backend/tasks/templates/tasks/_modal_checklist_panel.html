{% with items=task.checklist_items.all %}
<div class="checklist-progress-note">
  {% if items %}{{ items|length }} item{{ items|length|pluralize }} &middot; {{ task.progress }}% complete{% else %}No checklist items yet.{% endif %}
</div>
<div class="checklist-items">
  {% for item in items %}
  <div class="checklist-row">
    <label class="checklist-check">
      <input type="checkbox" {% if item.done %}checked{% endif %}
             hx-post="{% url 'checklist_toggle' task.id item.id %}" hx-target="#checklist-panel" hx-swap="innerHTML">
      <span class="{% if item.done %}done{% endif %}">{{ item.text }}</span>
    </label>
    <button type="button" class="icon-btn danger" title="Remove"
            hx-post="{% url 'checklist_delete' task.id item.id %}" hx-target="#checklist-panel" hx-swap="innerHTML">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endwith %}

<form class="checklist-add-row" hx-post="{% url 'checklist_add' task.id %}" hx-target="#checklist-panel" hx-swap="innerHTML">
  {{ checklist_form.text }}
  <button type="submit" class="btn-secondary">Add</button>
</form>
